name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --check

      - name: Run clippy linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit & integration tests
        run: cargo test --workspace --verbose

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly package
        run: wasm-pack build crates/kymion-wasm --release --target web --out-dir ../../web/pkg

      - name: Build CLI release binary
        run: cargo build --release -p kymion-cli

      - name: Run CLI smoke tests
        run: |
          ./target/release/kymion --help
          ./target/release/kymion schema > /dev/null
          ./target/release/kymion new test_project.kymion.json --name "CI Song" --tempo 128
          ./target/release/kymion info test_project.kymion.json --full
          ./target/release/kymion render test_project.kymion.json -o test_out.wav
          ./target/release/kymion analyze test_project.kymion.json

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WebAssembly release bundle
        run: wasm-pack build crates/kymion-wasm --release --target web --out-dir ../../web/pkg

      - name: Verify WebAssembly distribution files
        run: |
          test -f web/pkg/kymion_wasm_bg.wasm
          test -f web/pkg/kymion_wasm.js
          test -f web/index.html
          test -f web/app.js
          test -f web/worklet.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
