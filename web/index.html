<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kymion</title>
<link rel="icon" href="logo.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="logo.svg" alt="Kymion" class="logo">
  <h1>KYMION</h1>
  <div class="divider"></div>
  <div class="grp transport">
    <button id="stop" title="Stop / return to start (Enter)">Stop</button>
    <button id="play" title="Play / pause (Space)">Play</button>
    <button id="loop" title="Loop region (L)">Loop</button>
    <button id="metro" title="Metronome (M)">Click</button>
  </div>
  <div id="pos" title="bar : beat : tick  |  seconds">001:1:000</div>
  <div class="meter-box" id="master-meter" title="Master Bus Output (L / R dB)">
    <div class="meter-bar-wrap"><div class="meter-fill" id="meter-l"></div></div>
    <div class="meter-bar-wrap"><div class="meter-fill" id="meter-r"></div></div>
    <div class="meter-labels"><span>-24</span><span>-6</span><span>0dB</span></div>
  </div>
  <label>BPM <input id="tempo" type="number" min="20" max="400" value="120"></label>
  <label>Sig <input id="ts-num" type="number" min="1" max="32" value="4" style="width:38px"> /
    <select id="ts-den"><option>2</option><option selected>4</option><option>8</option><option>16</option></select></label>
  <label>Snap <select id="snap">
    <option value="480">1/4</option><option value="240" selected>1/8</option>
    <option value="120">1/16</option><option value="60">1/32</option><option value="1">Off</option></select></label>
  <div class="divider"></div>
  <div class="grp">
    <button id="view-arrange" title="Arrangement view (Tab)">Arrange</button>
    <button id="view-roll" title="Piano roll (Tab)">Piano Roll</button>
  </div>
  <div class="grp">
    <button id="tool-draw" title="Draw tool (D)">Draw</button>
    <button id="tool-select" title="Select tool (V)">Select</button>
  </div>
  <div class="grp">
    <button id="zoom-out" title="Zoom out (Ctrl+wheel)">-</button>
    <button id="zoom-in" title="Zoom in">+</button>
  </div>
  <div class="spacer"></div>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <button id="quantize" title="Quantize selected track to snap grid">Quantize</button>
  <div class="divider"></div>
  <button id="import-midi">Import MIDI</button>
  <button id="export-midi">Export MIDI</button>
  <button id="import-soundfont" title="Load SoundFont (.sf2) instrument">Import SF2</button>
  <button id="import-audio">Import Audio</button>
  <button id="wav">Export WAV</button>
  <button id="save">Save</button>
  <button id="load">Load</button>
  <input id="file" type="file" accept=".json" hidden>
  <input id="midi-file" type="file" accept=".mid,.midi" hidden>
  <input id="sf2-file" type="file" accept=".sf2,.soundfont" hidden>
  <input id="audio-file" type="file" accept="audio/*,.wav,.mp3,.ogg,.flac" hidden>
</header>
<main>
  <aside>
    <h2>Tracks</h2>
    <div id="tracks"></div>
    <div class="btn-row">
      <button id="add-inst">+ Instrument</button>
      <button id="add-vocal">+ Vocal</button>
      <button id="add-audio">+ Audio</button>
    </div>

    <h2>Instrument / SoundFont</h2>
    <div id="inst-panel"></div>

    <h2>Automation (selected track)</h2>
    <div class="row"><select id="auto-param"><option value="gain">Gain</option><option value="pan">Pan</option></select>
      <input id="auto-val" type="range" min="0" max="2" step="0.05" value="1"><span id="auto-val-txt" style="width:30px">1.00</span></div>
    <div class="btn-row">
      <button id="auto-add">+ Point @ playhead</button>
      <button id="auto-clear">Clear</button>
    </div>

    <h2>Track FX Chain</h2>
    <div id="fx-rack"></div>
    <div class="btn-row">
      <button id="add-fx-eq">+ EQ</button>
      <button id="add-fx-delay">+ Delay</button>
      <button id="add-fx-reverb">+ Reverb</button>
    </div>

    <h2>Vocal Tuning</h2>
    <div id="expr"></div>

    <h2>Master Bus FX</h2>
    <div id="master-fx-rack"></div>
    <div class="btn-row">
      <button id="add-master-fx-eq">+ Master EQ</button>
      <button id="add-master-fx-comp">+ Master Comp</button>
    </div>

    <h2>Mix Diagnostics & LUFS</h2>
    <div id="diag-panel" class="diag-panel">
      <div id="lufs-display" class="lufs-box">
        <span class="lufs-val" id="lufs-val">--.- LUFS</span>
        <span class="lufs-tag" id="lufs-tag">Ready</span>
      </div>
      <div style="font-size:10px;color:#888;display:flex;justify-content:space-between">
        <span>True Peak: <b id="tp-val" style="color:#eee">--.- dBTP</b></span>
        <span>LRA: <b id="lra-val" style="color:#eee">--.- LU</b></span>
      </div>
      <button id="btn-diagnose" style="width:100%;margin-top:2px">Run Mix Diagnostics</button>
      <div id="clash-list" style="margin-top:2px"></div>
    </div>

    <h2>Agent Console</h2>
    <textarea id="cmd" rows="5" spellcheck="false">{"cmd":"add_fx","track":1,"kind":{"type":"reverb","room_size":0.7,"damping":0.3,"width":1.0,"mix":0.35}}</textarea>
    <button id="run">Apply Command(s)</button>
    <pre id="log"></pre>
  </aside>
  <section><canvas id="roll"></canvas></section>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
